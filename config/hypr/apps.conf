# Window Rules

# Suppress maximize for all
windowrule {
    name = suppress-maximize
    match:class = .*
    suppress_event = maximize
}

# Fix XWayland dragging
windowrule {
    name = fix-xwayland-drags
    match:class = ^$
    match:title = ^$
    match:xwayland = true
    match:float = true
    match:fullscreen = false
    match:pin = false
    no_focus = true
}

# Float common dialogs
windowrule {
    name = float-pavucontrol
    match:class = ^(pavucontrol)$
    float = yes
}

windowrule {
    name = float-nm-editor
    match:class = ^(nm-connection-editor)$
    float = yes
}

windowrule {
    name = float-blueman
    match:class = ^(blueman-manager)$
    float = yes
}

windowrule {
    name = float-calculator
    match:class = ^(gnome-calculator)$
    float = yes
}

windowrule {
    name = float-file-dialogs
    match:title = ^(File Operation Progress|Confirm to replace files|Open File|Save File|Save As)$
    float = yes
}

# Picture-in-picture
windowrule {
    name = pip
    match:title = ^(Picture-in-Picture)$
    float = yes
    pin = yes
    size = 480 270
    move = 100%-490 100%-280
}

# Satty screenshot editor
windowrule {
    name = float-satty
    match:class = ^(com.gabm.satty)$
    float = yes
}

# Opacity for terminals
windowrule {
    name = terminal-opacity
    match:class = ^(Alacritty|kitty)$
    opacity = 0.95 0.85
}
