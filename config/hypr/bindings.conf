# Keybindings - Omarchy Style
$mainMod = SUPER

# App launchers
bind = $mainMod, Return, exec, ghostty
bind = $mainMod SHIFT, Return, exec, alacritty
bind = $mainMod, Space, exec, rofi -show drun -show-icons
bind = $mainMod SHIFT, F, exec, nautilus || dolphin
bind = $mainMod SHIFT, N, exec, nvim
bind = $mainMod SHIFT, B, exec, firefox

# Window management
bind = $mainMod, W, killactive,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, T, togglefloating,
bind = $mainMod, J, layoutmsg, togglesplit
bind = $mainMod, P, pseudo,
bind = $mainMod, O, pin,

# Focus navigation
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Swap windows
bind = $mainMod SHIFT, left, swapwindow, l
bind = $mainMod SHIFT, right, swapwindow, r
bind = $mainMod SHIFT, up, swapwindow, u
bind = $mainMod SHIFT, down, swapwindow, d

# Resize
binde = $mainMod, minus, resizeactive, -40 0
binde = $mainMod, equal, resizeactive, 40 0
binde = $mainMod SHIFT, minus, resizeactive, 0 -40
binde = $mainMod SHIFT, equal, resizeactive, 0 40

# Workspaces
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Workspace navigation
bind = $mainMod, TAB, workspace, e+1
bind = $mainMod SHIFT, TAB, workspace, e-1
bind = $mainMod CTRL, TAB, workspace, previous
bind = ALT, TAB, cyclenext,
bind = ALT, TAB, bringactivetotop,

# Scratchpad (minimize/restore)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:magic
bind = $mainMod CTRL, S, exec, hypr-window-restore

# Silent move to workspace (window goes, you stay)
bind = $mainMod SHIFT ALT, 1, movetoworkspacesilent, 1
bind = $mainMod SHIFT ALT, 2, movetoworkspacesilent, 2
bind = $mainMod SHIFT ALT, 3, movetoworkspacesilent, 3
bind = $mainMod SHIFT ALT, 4, movetoworkspacesilent, 4
bind = $mainMod SHIFT ALT, 5, movetoworkspacesilent, 5
bind = $mainMod SHIFT ALT, 6, movetoworkspacesilent, 6
bind = $mainMod SHIFT ALT, 7, movetoworkspacesilent, 7
bind = $mainMod SHIFT ALT, 8, movetoworkspacesilent, 8
bind = $mainMod SHIFT ALT, 9, movetoworkspacesilent, 9
bind = $mainMod SHIFT ALT, 0, movetoworkspacesilent, 10

# Move window to other monitor
bind = $mainMod SHIFT, period, movewindow, mon:+1
bind = $mainMod SHIFT, comma, movewindow, mon:-1

# Focus other monitor
bind = $mainMod, period, focusmonitor, +1
bind = $mainMod, comma, focusmonitor, -1

# Mouse bindings
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Screenshots (grim + slurp + satty)
bind = , Print, exec, ~/.local/bin/omarchy-screenshot full
bind = $mainMod, Print, exec, ~/.local/bin/omarchy-screenshot area
bind = $mainMod SHIFT, Print, exec, ~/.local/bin/omarchy-screenshot window

# Screen recording
bind = $mainMod ALT, R, exec, ~/.local/bin/omarchy-screenrecord

# Window switcher (find any open window)
bind = $mainMod CTRL, W, exec, rofi -show window -show-icons

# Clipboard history
bind = $mainMod, V, exec, cliphist list | rofi -dmenu -p "Clipboard" | cliphist decode | wl-copy

# Color picker
bind = $mainMod SHIFT, C, exec, hyprpicker -a

# Waybar toggle
bind = $mainMod, B, exec, killall -SIGUSR1 waybar

# Lock screen
bind = $mainMod, L, exec, hyprlock

# Theme switcher
bind = $mainMod CTRL SHIFT, Space, exec, ~/.local/bin/omarchy-theme-set

# Keybindings cheatsheet
bind = $mainMod, K, exec, hypr-keybinds

# Wallpaper cycle
bind = $mainMod CTRL, Space, exec, ~/.local/bin/omarchy-wallpaper-next

# Notifications (swaync)
bind = $mainMod, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, N, exec, swaync-client -C

# Audio device switcher
bind = $mainMod, A, exec, audio-switch

# Media keys
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = , XF86MonBrightnessUp, exec, brightnessctl -e4 -n2 set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl -e4 -n2 set 5%-
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous

# Tmux
bind = $mainMod ALT, Return, exec, ghostty -e tmux new-session

# Workspace overview (hyprexpo plugin)
bind = $mainMod, code:49, hyprexpo:expo, toggle

# Window groups (tabbed windows)
bind = $mainMod, G, togglegroup,
bind = $mainMod ALT, left, moveintogroup, l
bind = $mainMod ALT, right, moveintogroup, r
bind = $mainMod ALT, up, moveintogroup, u
bind = $mainMod ALT, down, moveintogroup, d
bind = $mainMod ALT, TAB, changegroupactive, f
bind = $mainMod ALT SHIFT, TAB, changegroupactive, b
bind = $mainMod SHIFT, G, moveoutofgroup,
bind = $mainMod ALT, 1, changegroupactive, 0
bind = $mainMod ALT, 2, changegroupactive, 1
bind = $mainMod ALT, 3, changegroupactive, 2
bind = $mainMod ALT, 4, changegroupactive, 3
bind = $mainMod ALT, 5, changegroupactive, 4
bind = $mainMod, bracketright, lockactivegroup, toggle

# Per-window opacity toggle
bind = $mainMod, BackSpace, setprop, active opaque toggle

# Tiled fullscreen (maximize within tile)
bind = $mainMod CTRL, F, fullscreenstate, 0 2

# Quick toggle last focused window
bind = $mainMod CTRL, comma, focuscurrentorlast,

# Move workspace to other monitor
bind = $mainMod SHIFT ALT, period, movecurrentworkspacetomonitor, +1
bind = $mainMod SHIFT ALT, comma, movecurrentworkspacetomonitor, -1

# Resize submap (SUPER+R enters resize mode, arrows resize, Escape exits)
bind = $mainMod, R, submap, resize

submap = resize
binde = , left, resizeactive, -40 0
binde = , right, resizeactive, 40 0
binde = , up, resizeactive, 0 -40
binde = , down, resizeactive, 0 40
bind = , Escape, submap, reset
bind = , Return, submap, reset
submap = reset
