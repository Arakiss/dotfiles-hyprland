# Hypridle - idle manager
#
# Power strategy: this machine doubles as a server, so suspend/hibernate
# are disabled system-wide (see docs/power-management.md). Hypridle only
# manages screen lock and DPMS — the system never sleeps.

general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# Lock screen after 5 minutes
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn off screen after 10 minutes (system stays fully active)
listener {
    timeout = 600
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
