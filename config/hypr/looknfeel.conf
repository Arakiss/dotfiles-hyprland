# Look and Feel - Omarchy Style

general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2

    col.active_border = rgba(7aa2f7ee) rgba(bb9af7ee) 45deg
    col.inactive_border = rgba(414868aa)

    resize_on_border = true
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2

    active_opacity = 0.97
    inactive_opacity = 0.90

    shadow {
        enabled = true
        range = 8
        render_power = 3
        color = rgba(1a1a2eee)
    }

    blur {
        enabled = true
        size = 6
        passes = 3
        brightness = 0.60
        contrast = 0.75
        noise = 0.02
        vibrancy = 0.2
    }
}

animations {
    enabled = yes, please :)

    bezier = easeOutQuint, 0.23, 1, 0.32, 1
    bezier = easeInOutCubic, 0.65, 0.05, 0.36, 1
    bezier = linear, 0, 0, 1, 1
    bezier = almostLinear, 0.5, 0.5, 0.75, 1
    bezier = quick, 0.15, 0, 0.1, 1
    bezier = overshot, 0.05, 0.9, 0.1, 1.1

    animation = global, 1, 10, default
    animation = border, 1, 5.39, easeOutQuint
    animation = windows, 1, 4.79, easeOutQuint
    animation = windowsIn, 1, 4.1, easeOutQuint, popin 87%
    animation = windowsOut, 1, 1.49, linear, popin 87%
    animation = fadeIn, 1, 1.73, almostLinear
    animation = fadeOut, 1, 1.46, almostLinear
    animation = fade, 1, 3.03, quick
    animation = layers, 1, 3.81, easeOutQuint
    animation = layersIn, 1, 4, easeOutQuint, fade
    animation = layersOut, 1, 1.5, linear, fade
    animation = fadeLayersIn, 1, 1.79, almostLinear
    animation = fadeLayersOut, 1, 1.39, almostLinear
    animation = workspaces, 1, 1.94, almostLinear, fade
    animation = workspacesIn, 1, 1.21, almostLinear, fade
    animation = workspacesOut, 1, 1.94, almostLinear, fade
    animation = specialWorkspace, 1, 3, easeOutQuint, slidevert
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
    special_scale_factor = 0.85
}

master {
    new_status = master
}

misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    focus_on_activate = true
}

cursor {
    hide_on_key_press = true
    warp_on_change_workspace = true
}

binds {
    hide_special_on_workspace_change = true
}

ecosystem {
    no_update_news = true
}

group {
    col.border_active = rgba(7aa2f7ee)
    col.border_inactive = rgba(414868aa)

    groupbar {
        font_family = JetBrainsMono Nerd Font
        font_size = 10
        height = 18
        col.active = rgba(7aa2f7ee)
        col.inactive = rgba(1a1b26cc)
        text_color = rgba(c0caf5ff)
    }
}
