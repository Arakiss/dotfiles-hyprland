"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](mauve)\
$directory\
[](fg:mauve bg:lavender)\
$package\
$bun\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
[](fg:lavender bg:teal)\
$git_branch\
$git_status\
[ ](fg:teal)\
$fill\
$custom\
$line_break\
$character"""

right_format = ""
continuation_prompt = '▶▶ '
palette = 'catppuccin_mocha'
add_newline = true

# ══════════════════════════════════════════════════════════════════════════════
# CUSTOM - Random Quotes
# ══════════════════════════════════════════════════════════════════════════════

[custom.quote]
command = "~/.local/bin/random-quote"
when = true
format = "[  $output]($style)"
style = "italic fg:overlay1"
disabled = false

# ══════════════════════════════════════════════════════════════════════════════
# CORE
# ══════════════════════════════════════════════════════════════════════════════

[fill]
symbol = " "

[directory]
style = "bg:mauve fg:crust"
format = "[ $path ]($style)"
truncation_length = 1
truncate_to_repo = true
read_only = " 󰌾"
read_only_style = "bg:mauve fg:red"

# No substitutions - show real path
# [directory.substitutions]

# ══════════════════════════════════════════════════════════════════════════════
# GIT — Nerd Font Icons
# ══════════════════════════════════════════════════════════════════════════════

[git_branch]
symbol = ""
style = "bg:teal"
format = '[[ $symbol $branch ](fg:crust bg:teal)]($style)'
truncation_length = 20

[git_commit]
commit_hash_length = 7
tag_symbol = '  '

[git_status]
style = "bg:teal"
format = '[[($all_status$ahead_behind )](fg:crust bg:teal)]($style)'
ahead = "󰜸$count "
behind = "󰜯$count "
diverged = "󰃻 "
conflicted = " "
untracked = "?$count "
stashed = "󰆓 "
modified = "~$count "
staged = "+$count "
renamed = "󰑕 "
deleted = "󰆴$count "

[git_state]
style = "bg:red fg:crust bold"
format = '[[ $state( $progress_current/$progress_total) ](bg:red fg:crust)]($style)'

# ══════════════════════════════════════════════════════════════════════════════
# LANGUAGES — Official Nerd Font Symbols
# ══════════════════════════════════════════════════════════════════════════════

[package]
symbol = "󰏗"
style = "bg:lavender"
format = '[[ $symbol $version ](fg:crust bg:lavender)]($style)'
display_private = true

[bun]
symbol = ""
style = "bg:lavender"
format = '[[ $symbol $version ](fg:crust bg:lavender)]($style)'
detect_files = ["bun.lockb", "bun.lock", "bunfig.toml"]

[nodejs]
symbol = ""
style = "bg:lavender"
format = '[[ $symbol $version ](fg:crust bg:lavender)]($style)'
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[python]
symbol = ""
style = "bg:lavender"
format = '[[ $symbol $version ](fg:crust bg:lavender)]($style)'
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", ".python-version"]
detect_extensions = ["py"]

[rust]
symbol = "󱘗"
style = "bg:lavender"
format = '[[ $symbol $version ](fg:crust bg:lavender)]($style)'
detect_files = ["Cargo.toml"]

[golang]
symbol = ""
style = "bg:lavender"
format = '[[ $symbol $version ](fg:crust bg:lavender)]($style)'
detect_files = ["go.mod", "go.sum"]

[docker_context]
symbol = ""
style = "bg:lavender"
format = '[[ $symbol $context ](fg:crust bg:lavender)]($style)'
only_with_files = true

# ══════════════════════════════════════════════════════════════════════════════
# STATUS
# ══════════════════════════════════════════════════════════════════════════════

[cmd_duration]
min_time = 500
format = "[ 󱎫 $duration ](fg:yellow)"
show_milliseconds = false

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold fg:green)'
error_symbol = '[❯](bold fg:red)'
vimcmd_symbol = '[❮](bold fg:green)'
vimcmd_replace_symbol = '[❮](bold fg:lavender)'
vimcmd_visual_symbol = '[❮](bold fg:yellow)'

# ══════════════════════════════════════════════════════════════════════════════
# CATPPUCCIN MOCHA PALETTE
# ══════════════════════════════════════════════════════════════════════════════

