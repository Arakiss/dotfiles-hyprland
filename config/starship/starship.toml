"$schema" = 'https://starship.rs/config-schema.json'

# Starship prompt — flat & theme-adaptive (reworked 2026-07-06).
# Design rules:
#   - No powerline bubble segments: they rendered as color blobs and aged badly.
#   - ANSI named colors ONLY (cyan, yellow, purple…): the prompt inherits the
#     active terminal theme, so it re-skins itself with `vibe` (cyberpunk2077
#     maps yellow→#fcee0a, sober/TokyoNight maps its own) — zero config drift.
#   - The random-quote module is out of the prompt (still runnable as
#     `random-quote`); re-enable by adding $custom back to format.
#   - Last-login banner is suppressed via ~/.hushlogin, not here.

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$package\
$bun\
$nodejs\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

right_format = ""
continuation_prompt = '[❯❯ ](dim)'
add_newline = true

# ══════════════════════════════════════════════════════════════════════════════
# CORE
# ══════════════════════════════════════════════════════════════════════════════

[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only](red) "
truncation_length = 2
truncate_to_repo = true
read_only = " 󰌾"

[git_branch]
symbol = ""
style = "purple"
format = '[$symbol $branch]($style) '
truncation_length = 20

[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
ahead = "󰜸$count "
behind = "󰜯$count "
diverged = "󰃻 "
conflicted = " "
untracked = "?$count "
stashed = "󰆓 "
modified = "~$count "
staged = "+$count "
renamed = "󰑕 "
deleted = "󰆴$count "

[git_state]
style = "bold red"
format = '[$state( $progress_current/$progress_total)]($style) '

[git_commit]
commit_hash_length = 7
tag_symbol = '  '

# ══════════════════════════════════════════════════════════════════════════════
# LANGUAGES — dim, symbol + version, only when the project uses them
# ══════════════════════════════════════════════════════════════════════════════

[package]
symbol = "󰏗"
style = "dimmed white"
format = '[$symbol $version]($style) '
display_private = true

[bun]
symbol = ""
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["bun.lockb", "bun.lock", "bunfig.toml"]

[nodejs]
symbol = ""
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["package.json", ".nvmrc", ".node-version"]
detect_folders = ["node_modules"]

[python]
symbol = ""
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", ".python-version"]
detect_extensions = ["py"]

[rust]
symbol = "󱘗"
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["Cargo.toml"]

[golang]
symbol = ""
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["go.mod", "go.sum"]

[docker_context]
symbol = ""
style = "dimmed white"
format = '[$symbol $context]($style) '
only_with_files = true

# ══════════════════════════════════════════════════════════════════════════════
# STATUS
# ══════════════════════════════════════════════════════════════════════════════

[cmd_duration]
min_time = 500
format = "[󱎫 $duration](yellow) "
show_milliseconds = false

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold yellow)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_replace_symbol = '[❮](bold purple)'
vimcmd_visual_symbol = '[❮](bold yellow)'

# ══════════════════════════════════════════════════════════════════════════════
# PARKED — random quote (out of the prompt; run `random-quote` manually)
# ══════════════════════════════════════════════════════════════════════════════

[custom.quote]
command = "~/.local/bin/random-quote"
when = true
format = "[  $output]($style)"
style = "italic dimmed white"
disabled = true
