"$schema" = 'https://starship.rs/config-schema.json'

# Starship prompt — two-line "lean" frame, theme-adaptive (reworked 2026-07-06).
# Design rules:
#   - Two lines with box-drawing corners (╭─ … ╰─❯): structure and character
#     WITHOUT powerline bubbles (which aged into color blobs). Box glyphs render
#     in any mono font, so no emoji-fallback risk.
#   - ANSI named colors ONLY: the prompt inherits the active terminal theme and
#     re-skins itself with `vibe` (cyberpunk2077 → yellow #fcee0a, etc.).
#   - Language modules use text labels, not Nerd Font glyphs (those fell back to
#     color emoji on some fonts). $nodejs is off when $bun is present (redundant).
#   - Right side (versions + duration) is dim, pushed to the edge with $fill.
#   - Random quote runnable as `random-quote`; last-login hushed via ~/.hushlogin.

format = """
$directory\
$git_branch\
$git_status\
$git_state\
$fill\
$bun\
$python\
$rust\
$golang\
$docker_context\
$cmd_duration\
$line_break\
$character"""

right_format = ""
continuation_prompt = '[▶ ](dim)'
add_newline = true

[fill]
symbol = " "

# ══════════════════════════════════════════════════════════════════════════════
# CORE
# ══════════════════════════════════════════════════════════════════════════════

# Folder icon is FontAwesome  (U+F07B, BMP PUA) — that range renders reliably;
# the emoji-fallback problem was the high Material-Design plane (U+F0000+).
[directory]
style = "bold cyan"
format = "[ $path]($style)[$read_only](red) "
truncation_length = 2
truncate_to_repo = true
read_only = " "

[git_branch]
symbol = ""
style = "purple"
format = '[on](dim) [$symbol $branch]($style) '
truncation_length = 20

# Status markers use safe Unicode (arrows/symbols), NOT Material-Design NF glyphs
# — the latter fall back to color emoji on some fonts (the lesson from the icons).
[git_status]
style = "yellow"
format = '([$all_status$ahead_behind]($style) )'
ahead = "↑$count "
behind = "↓$count "
diverged = "↕ "
conflicted = "✖$count "
untracked = "?$count "
stashed = "≡ "
modified = "~$count "
staged = "+$count "
renamed = "»$count "
deleted = "✘$count "

[git_state]
style = "bold red"
format = '[$state( $progress_current/$progress_total)]($style) '

[git_commit]
commit_hash_length = 7
tag_symbol = '  '

# ══════════════════════════════════════════════════════════════════════════════
# LANGUAGES — text labels, not Nerd Font glyphs.
# Rationale (2026-07-06): Material-Design NF glyphs (package 󰏗, rust 󱘗) are NOT
# in Monaspace Neon and fell back to COLOR EMOJI (🌐/🦀), breaking the monochrome
# terminal. Lowercase text labels render in any font and read cleanly. `package`
# dropped: it duplicated the language version (crate/pkg vs toolchain).
# ══════════════════════════════════════════════════════════════════════════════

[bun]
symbol = "bun"
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["bun.lockb", "bun.lock", "bunfig.toml"]

# node only in node-explicit projects: package.json alone is also a Bun project,
# so showing both bun+node is redundant (the screenshot's "bun … node …" noise).
[nodejs]
symbol = "node"
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = [".nvmrc", ".node-version"]

[python]
symbol = "py"
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["requirements.txt", "pyproject.toml", "Pipfile", ".python-version"]
detect_extensions = ["py"]

[rust]
symbol = "rust"
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["Cargo.toml"]

[golang]
symbol = "go"
style = "dimmed white"
format = '[$symbol $version]($style) '
detect_files = ["go.mod", "go.sum"]

[docker_context]
symbol = "docker"
style = "dimmed white"
format = '[$symbol $context]($style) '
only_with_files = true

# ══════════════════════════════════════════════════════════════════════════════
# STATUS
# ══════════════════════════════════════════════════════════════════════════════

[cmd_duration]
min_time = 500
format = "[󱎫 $duration](yellow) "
show_milliseconds = false

[line_break]
disabled = false

[character]
success_symbol = '[❯](bold yellow)'
error_symbol = '[❯](bold red)'
vimcmd_symbol = '[❮](bold green)'
vimcmd_replace_symbol = '[❮](bold purple)'
vimcmd_visual_symbol = '[❮](bold yellow)'

# ══════════════════════════════════════════════════════════════════════════════
# PARKED — random quote (out of the prompt; run `random-quote` manually)
# ══════════════════════════════════════════════════════════════════════════════

[custom.quote]
command = "~/.local/bin/random-quote"
when = true
format = "[  $output]($style)"
style = "italic dimmed white"
disabled = true
