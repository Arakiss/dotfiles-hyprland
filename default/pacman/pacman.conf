#
# CachyOS Pacman Configuration
# Optimized for CachyOS with Hyprland
#

[options]
HoldPkg     = pacman glibc
Architecture = auto

# Visual
Color
ILoveCandy
VerbosePkgLists

# Performance
DisableDownloadTimeout
ParallelDownloads = 10
DownloadUser = alpm

# Security
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

#
# REPOSITORIES (CachyOS v3 optimized + Arch)
#

# CachyOS repos (x86-64-v3 optimized builds)
[cachyos-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-core-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos-extra-v3]
Include = /etc/pacman.d/cachyos-v3-mirrorlist

[cachyos]
Include = /etc/pacman.d/cachyos-mirrorlist

# Arch repos
[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist
